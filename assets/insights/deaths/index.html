<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="HD heatmap смертей Rejoin на карте GTA V">
  <meta name="color-scheme" content="dark">
  <title>Death Map · Rejoin Insights</title>
  <link rel="stylesheet" href="/insights/deaths/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/insights/deaths/styles.css">
</head>
<body>
  <main class="insights-shell">
    <header class="topbar">
      <a class="brand" href="/insights"><span class="brand-mark">R</span><span>Rejoin Insights</span></a>
      <div class="topbar-divider"></div>
      <div class="page-title"><span class="eyebrow">Spatial analytics</span><strong>Death Map</strong></div>
      <div class="top-actions">
        <a class="secondary-button qa-link" href="/insights">QA Pulse</a>
        <button class="secondary-button" id="export-button" type="button">Экспорт PNG</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="control-panel">
        <div class="panel-head">
          <div><span class="eyebrow">Источник</span><strong id="file-name">Серверные данные</strong></div>
          <span class="live-dot" id="data-status" aria-label="Данные загружены"></span>
        </div>
        <p class="error-message" id="error-message" role="alert" hidden></p>

        <div class="metric-grid">
          <div><span>Событий</span><strong id="metric-total">0</strong></div>
          <div><span>Игроком</span><strong id="metric-killed">0</strong></div>
          <div><span>Под землёй</span><strong id="metric-underground">0</strong></div>
        </div>

        <div class="control-group">
          <label for="period-filter">Период</label>
          <select id="period-filter">
            <option value="all">Весь файл</option>
            <option value="24h">Последние 24 часа</option>
            <option value="7d">Последние 7 дней</option>
            <option value="30d">Последние 30 дней</option>
          </select>
        </div>

        <div class="control-group timeline-control">
          <div class="range-label"><label for="timeline-filter">Хронология</label><output id="timeline-value">Все события</output></div>
          <input id="timeline-filter" type="range" min="0" max="100" step="1" value="100">
          <button id="timeline-play" type="button">Воспроизвести</button>
        </div>

        <div class="control-group cause-list" id="cause-list">
          <span class="control-label">Причина смерти</span>
        </div>

        <div class="control-group">
          <div class="range-label"><label for="radius-filter">Радиус пятна</label><output id="radius-value">22</output></div>
          <input id="radius-filter" type="range" min="10" max="48" step="2" value="22">
        </div>

        <label class="toggle-row">
          <span><strong>Исходные точки</strong><small>Клик показывает событие и координаты</small></span>
          <input id="points-toggle" type="checkbox">
        </label>

        <div class="control-group layer-controls">
          <span class="control-label">Контекст карты</span>
          <label><span><strong>Точки интереса</strong><small>Работы, сервисы, транспорт и активности</small></span><input id="poi-toggle" type="checkbox"></label>
          <label><span><strong>Safe-зоны</strong><small>Безопасные и полицейские территории</small></span><input id="zones-toggle" type="checkbox"></label>
          <label><span><strong>Банкоматы</strong><small>Отдельный слой без перегруза основной карты</small></span><input id="atms-toggle" type="checkbox"></label>
        </div>

        <div class="control-group hotspots-panel">
          <div class="hotspots-head"><span class="control-label">Опасные точки · 100 м</span><small id="context-count">Контекст загружается</small></div>
          <ol class="hotspots-list" id="hotspots-list" aria-live="polite"><li class="empty-hotspot">Нет данных</li></ol>
        </div>

        <div class="control-group map-actions">
          <button id="reset-view" type="button">Показать всю карту</button>
          <small>Колесо — масштаб · мышь — перемещение</small>
        </div>
      </aside>

      <div class="map-panel" id="map-panel">
        <div class="map-status"><span>HD Atlas · 16K</span><span id="map-count">0 событий</span></div>
        <div id="map" class="map-canvas" aria-label="HD-карта смертей GTA V"></div>
      </div>
    </section>
  </main>
  <script src="/insights/deaths/vendor/leaflet/leaflet.js"></script>
  <script src="/insights/deaths/vendor/leaflet-heat.js"></script>
  <script src="/insights/deaths/vendor/html2canvas.min.js"></script>
  <script src="/insights/deaths/app.js"></script>
</body>
</html>
